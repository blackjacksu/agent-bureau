services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentmap
      POSTGRES_PASSWORD: agentmap
      POSTGRES_DB: agentmap
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U agentmap"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes: { pgdata: {} }
